[pytest]
pythonpath = .
testpaths = tests
# Fail on deprecation warnings, so problems like the old httpx one show up at once
filterwarnings =
    error::DeprecationWarning
    error::starlette.exceptions.StarletteDeprecationWarning
    # Inside google-genai 2.30.1 (types.py), not our code; remove after upgrading the library
    ignore:'_UnionGenericAlias' is deprecated:DeprecationWarning
